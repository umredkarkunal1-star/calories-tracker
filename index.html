<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#f7f5ed">
    <meta name="description" content="A calmer way to notice your meals, nutrition, and daily progress.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Calorise">
    <script>
      try {
        const savedTheme = window.localStorage.getItem("nourish:theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
          document.querySelector('meta[name="theme-color"]').content =
            savedTheme === "dark" ? "#101b17" : "#f7f5ed";
        }
        const savedTextSize = window.localStorage.getItem("nourish:text-size");
        if (["normal", "large", "extra-large"].includes(savedTextSize)) {
          document.documentElement.dataset.textSize = savedTextSize;
        }
      } catch (error) {
        console.warn("Could not read the saved theme preference.", error);
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/calorise-logo.png">
    <link rel="apple-touch-icon" href="/calorise-logo-192.png">
    <title>Calorise — Food, in focus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      if (location.hostname === "127.0.0.1") {
        const canonicalUrl = new URL(location.href);
        canonicalUrl.hostname = "localhost";
        location.replace(canonicalUrl.href);
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://js.puter.com/v2/"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
